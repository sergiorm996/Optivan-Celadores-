<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Optivan Celadores">
    <meta name="theme-color" content="#0F1720">
    <title>Optivan · Celadores</title>
    <link rel="icon" type="image/png" href="icono.png">
    <link rel="apple-touch-icon" href="icono.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2">
    <style>
        #splash{position:fixed;inset:0;z-index:9999;background:#0F1720;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity 0.6s ease}
        #splash img{width:70%;max-width:280px;object-fit:contain;animation:splashIn 0.8s ease}
        @keyframes splashIn{0%{opacity:0;transform:scale(0.8)}100%{opacity:1;transform:scale(1)}}
        #splash-subtitulo{margin-top:12px;font-size:13px;font-weight:600;color:rgba(255,255,255,0.4);letter-spacing:2px;text-transform:uppercase;font-family:'Poppins',sans-serif;}
        #splash-bar-wrap{position:absolute;bottom:60px;left:12%;right:12%;height:3px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
        #splash-bar{height:100%;width:0%;background:#FFC107;border-radius:3px;transition:width 0.15s linear}
        #splash.oculto{opacity:0;pointer-events:none}
    </style>
</head>
<body>

<div id="splash">
    <img src="splash.png" alt="Optivan">
    <div id="splash-subtitulo">Celadores</div>
    <div id="splash-bar-wrap"><div id="splash-bar"></div></div>
</div>

<div id="app"></div>
<div id="toast" class="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
